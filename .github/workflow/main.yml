name: Test deploy                    # Workflow 이름
on:                                  # Event 감지
  pull_request:
    branches: ["main"]  
  push:
    branches: ["deploy"]          
jobs:                                # Job 설정
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code.   # Repo checkout
        uses: actions/checkout@v3
      
      - name: Check Node v            # Node v 확인
        run: node -v
        
      - name: Install dependencies    # 의존 파일 설치
        run: npm install
      
      - name: Generate build          # React Build
        run: npm run build
      
      - name: Docker build & push to prod
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/beep_web:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/beep_web:latest
          
      - name: Deploy to prod
        uses: appleboy/ssh-action@master
        id: deploy-prod
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          envs: |
            GITHUB_SHA=${{ github.sha }}
          script: |
            docker stop beep_web || true
            docker rm beep_web || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/beep_web:latest || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/beep_web:latest
            docker run -d -p 3000:3000 --name beep_web ${{ secrets.DOCKER_USERNAME }}/beep_web:latest